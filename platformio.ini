[platformio]
default_envs = pico_1motor_endless

# ============================================================================
# Build Environments - Tested & Proven
# ============================================================================
# Only pico_1motor_endless is tested on hardware and included in CI.
# Other configurations (limited motors, dual motors) were untested.
# See .agentic/REMOVED_UNTESTED_CODE.md for details.

# Single Endless Motor (360° trim control - TESTED)
[env:pico_1motor_endless]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino
lib_archive = false
lib_deps =
    Simple FOC
    MIDI
build_flags =
    -DUSE_TINYUSB
    -DCFG_TUSB_CONFIG_FILE=\"my_tusb_config.h\"
    -Iinclude/    # Uncomment to build dummy passthrough mode (MIDI CC → HID, no FOC)
    # -DDUMMY_MODE
upload_port = /dev/ttyACM0

# Single Endless Motor + local Cessna trim preview (detents + end stops)
[env:pico_trim_preview]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino
lib_archive = false
lib_deps =
    Simple FOC
    MIDI
build_flags =
    -DUSE_TINYUSB
    -DCFG_TUSB_CONFIG_FILE=\"my_tusb_config.h\"
    -Iinclude/
upload_port = /dev/ttyACM0

# Single Limited Motor (0-180° throttle/flaps control)
[env:pico_1motor_limited]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino
lib_archive = false
lib_deps =
    Simple FOC
    MIDI
build_flags =
    -DUSE_TINYUSB
    -DCFG_TUSB_CONFIG_FILE=\"my_tusb_config.h\"
    -Iinclude/
    -DMOTOR_LIMITED
debug_tool = cmsis-dap
upload_port = /dev/ttyACM0


# Test environment (native tests)
[env:test]
platform = native
test_framework = googletest
