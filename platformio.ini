[platformio]
default_envs = pico_1motor_endless

# ============================================================================
# Build Environments for Different Hardware Configurations
# ============================================================================

# Single Endless Motor (Current Hardware - Trim-like)
[env:pico_1motor_endless]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino
lib_archive = false
lib_deps =
    Simple FOC
build_flags =
    -DHW_CONFIG=0
    -DUSE_TINYUSB
    -DCFG_TUSB_CONFIG_FILE=\"my_tusb_config.h\"
    -Iinclude/
debug_tool = cmsis-dap
upload_port = /dev/ttyACM0

# Single Limited Motor (0-180° throttle/flaps)
[env:pico_1motor_limited]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino
lib_archive = false
lib_deps =
    Simple FOC
build_flags =
    -DHW_CONFIG=1
    -DUSE_TINYUSB
    -DCFG_TUSB_CONFIG_FILE=\"my_tusb_config.h\"
    -Iinclude/
debug_tool = cmsis-dap
upload_port = /dev/ttyACM0


# Dual Motors (Limited + Endless)
[env:pico_2motor_limited]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino
lib_archive = false
lib_deps =
    Simple FOC
build_flags =
    -DHW_CONFIG=2
    -DUSE_TINYUSB
    -DCFG_TUSB_CONFIG_FILE=\"my_tusb_config.h\"
    -Iinclude/
    debug_tool = cmsis-dap
upload_port = /dev/ttyACM0


# Test environment (native tests)
[env:test]
platform = native
test_framework = googletest
