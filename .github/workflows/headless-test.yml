name: Headless Test

on:
  push:
    branches: [dev, feature/*]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  pytest-headless:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyserial

      - name: Run headless pytest
        run: |
          python -m pytest -q
