name: Code Quality

on:
  push:
    branches: [ dev, main, feature/*, hotfix/* ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          pip install cpplint

      - name: C++ style check
        run: |
          find src include -name '*.cpp' -o -name '*.h' | while read file; do
            cpplint --quiet --filter=-legal/copyright,-build/include_subdir "$file" || true
          done

      - name: Check for common issues
        run: |
          echo "Checking for TODO/FIXME markers..."
          grep -rn "TODO\|FIXME" src/ include/ || echo "No TODO/FIXME found"
          
          echo "Checking for debug print statements..."
          grep -rn "Serial\.print.*DEBUG\|Serial\.println.*DEBUG" src/ || echo "No debug prints found"

  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate knowledge base
        run: |
          echo "Checking knowledge base structure..."
          
          # Check if key documentation files exist
          files_to_check=(
            ".agentic/KNOWLEDGE_BASE.md"
            ".agentic/HARDWARE_SETUP.md"
            "README.md"
            "AGENTS.md"
          )
          
          missing_files=0
          for file in "${files_to_check[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::warning::Missing documentation file: $file"
              missing_files=$((missing_files + 1))
            else
              echo "✓ Found: $file"
            fi
          done
          
          if [ $missing_files -eq 0 ]; then
            echo "✅ All required documentation files present"
          fi

      - name: Check README completeness
        run: |
          if [ -f "README.md" ]; then
            echo "Checking README.md for essential sections..."
            
            sections=("Purpose" "Hardware" "Build" "Upload" "Test")
            for section in "${sections[@]}"; do
              if grep -qi "$section" README.md; then
                echo "✓ Section found: $section"
              else
                echo "::warning::README may be missing '$section' section"
              fi
            done
          fi

      - name: Validate platformio.ini
        run: |
          if [ -f "platformio.ini" ]; then
            echo "Checking platformio.ini structure..."
            
            # Check for required environments
            envs=("pico_1motor_endless" "pico_1motor_limited" "pico_2motor_limited")
            for env in "${envs[@]}"; do
              if grep -q "\[env:$env\]" platformio.ini; then
                echo "✓ Environment defined: $env"
              else
                echo "::warning::platformio.ini missing environment: $env"
              fi
            done
            
            # Check for required dependencies
            deps=("Simple FOC" "Adafruit TinyUSB")
            for dep in "${deps[@]}"; do
              if grep -qi "$dep" platformio.ini; then
                echo "✓ Dependency found: $dep"
              else
                echo "::warning::platformio.ini may be missing dependency: $dep"
              fi
            done
          fi

  config-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate configuration files
        run: |
          echo "Checking configuration file structure..."
          
          # Check for required header files
          if [ -f "include/my_tusb_config.h" ]; then
            echo "✓ TinyUSB config present"
            
            # Verify key config flags
            flags=("CFG_TUD_HID" "CFG_TUD_MIDI" "CFG_TUD_CDC")
            for flag in "${flags[@]}"; do
              if grep -q "$flag" include/my_tusb_config.h; then
                echo "  ✓ Config flag: $flag"
              else
                echo "  ::warning::Missing TinyUSB flag: $flag"
              fi
            done
          else
            echo "::error::Missing include/my_tusb_config.h"
            exit 1
          fi
          
          if [ -f "src/config.h" ] || [ -f "include/config.h" ]; then
            echo "✓ Application config present"
          else
            echo "::warning::Application config.h not found in src/ or include/"
          fi

      - name: Check for hardcoded values
        run: |
          echo "Checking for hardcoded critical values..."
          
          # Check for hardcoded serial rates (should use constants)
          if grep -rn "115200\|31250" src/*.cpp | grep -v "const\|define" | grep -v "//"; then
            echo "::warning::Found hardcoded baud rates - consider using constants"
          fi
          
          # Check for magic numbers in motor config
          if grep -rn "0x36" src/*.cpp | grep -v "const\|define\|//.*0x36"; then
            echo "::notice::Found AS5600 I2C address 0x36 - ensure it's documented"
          fi

  summary:
    runs-on: ubuntu-latest
    needs: [lint, documentation, config-validation]
    if: always()
    steps:
      - name: Code quality summary
        run: |
          echo "## Code Quality Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation: ${{ needs.documentation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Config Validation: ${{ needs.config-validation.result }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.lint.result }}" = "success" ] && \
             [ "${{ needs.documentation.result }}" = "success" ] && \
             [ "${{ needs.config-validation.result }}" = "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ All quality checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Some quality checks had warnings or failures" >> $GITHUB_STEP_SUMMARY
          fi
