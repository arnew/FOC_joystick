name: Build Firmware

on:
  push:
    branches: [ dev, main, feature/*, hotfix/* ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          - pico_1motor_endless
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware (${{ matrix.environment }})
        run: |
          platformio run -e ${{ matrix.environment }}

      - name: Check firmware size
        run: |
          ELF_FILE=".pio/build/${{ matrix.environment }}/firmware.elf"
          if [ -f "$ELF_FILE" ]; then
            SIZE_KB=$(du -k "$ELF_FILE" | cut -f1)
            echo "Firmware size: ${SIZE_KB}KB"
            if [ $SIZE_KB -gt 1800 ]; then
              echo "::warning::Firmware size (${SIZE_KB}KB) approaching 2MB flash limit"
            fi
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/firmware.elf
            .pio/build/${{ matrix.environment }}/firmware.uf2
          retention-days: 30

  build-status:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Build failed for one or more environments"
            exit 1
          fi
          echo "✅ All firmware builds successful"
