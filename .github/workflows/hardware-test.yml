name: Hardware Test

on:
  push:
    branches: [dev, feature/*]
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify Python
        run: |
          python3 --version
          which python3
      
      - name: Check dependencies
        run: |
          # Add user pip bin to PATH
          export PATH="$HOME/.local/bin:$PATH"
          
          python3 --version
          which platformio || echo "⚠ platformio not in PATH"
          python3 -c "import serial" 2>/dev/null && echo "✓ pyserial installed" || echo "✗ pyserial missing"
          python3 -c "import pygame" 2>/dev/null && echo "✓ pygame installed" || echo "✗ pygame missing"
      
      - name: Build firmware
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          platformio run -e pico_1motor_endless
      
      - name: Upload firmware to device
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          platformio run -e pico_1motor_endless --target upload
      
      - name: Wait for device reset
        run: sleep 3
      
      - name: Run hardware tests
        run: |
          ./test/run_ci_tests.sh
        env:
          SERIAL_PORT: /dev/ttyACM0
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            test/*.log
            test/*.json
