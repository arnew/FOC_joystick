name: Hardware Test

on:
  push:
    branches: [dev, feature/*]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: [self-hosted, hardware]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify Python
        run: |
          python3 --version
          which python3
      
      - name: Setup Python venv
        run: |
          python3 -m venv $HOME/ci-venv || true
          echo "$HOME/ci-venv/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install platformio pyserial
          which platformio && echo "✓ platformio" || { echo "✗ platformio missing"; exit 1; }
      
      - name: Build firmware
        run: platformio run -e pico_1motor_endless
      
      - name: Upload firmware to device
        run: platformio run -e pico_1motor_endless --target upload
      
      - name: Wait for device reset
        run: sleep 3
      
      - name: Run hardware tests
        run: |
          ./test/run_ci_tests.sh
        env:
          SERIAL_PORT: /dev/ttyACM0
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            test/*.log
            test/*.json
